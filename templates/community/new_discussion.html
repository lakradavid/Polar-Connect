{% extends 'base.html' %}
{% block title %}New Discussion{% endblock %}
{% block content %}
<section class="pc-page-header"><div class="container"><h1><i class="fas fa-plus me-2"></i>Start a Discussion</h1></div></section>
<section class="section-padding bg-light-grey"><div class="container" style="max-width:640px">
<div class="pc-card p-4">
  {% if messages %}{% for msg in messages %}<div class="alert-polar-error mb-3"><i class="fas fa-exclamation-circle"></i> {{ msg }}</div>{% endfor %}{% endif %}
  <form method="post">{% csrf_token %}
    <div class="mb-3">
      <label class="pc-form-label">Forum *</label>
      <select name="forum" class="pc-form-control" required>
        <option value="">Select a forum…</option>
        {% for f in forums %}<option value="{{ f.pk }}" {% if request.GET.forum == f.pk|stringformat:"s" %}selected{% endif %}>{{ f.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="mb-3"><label class="pc-form-label">Title *</label><input type="text" name="title" class="pc-form-control" required placeholder="What would you like to discuss?"></div>
    <div class="mb-3"><label class="pc-form-label">Content *</label><textarea name="content" class="pc-form-control" rows="6" required placeholder="Describe your question or topic in detail…"></textarea></div>
    <div class="mb-4 form-check">
      <input class="form-check-input" type="checkbox" name="is_question" id="isQuestion">
      <label class="form-check-label" for="isQuestion" style="font-size:0.875rem">Mark as a question (seeking an answer)</label>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn-polar-primary"><i class="fas fa-paper-plane me-1"></i>Post Discussion</button>
      <a href="{% url 'community:forum' %}" class="btn-polar-outline">Cancel</a>
    </div>
  </form>
</div>
</div></section>
{% endblock %}
