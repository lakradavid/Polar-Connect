{% extends 'base.html' %}
{% block title %}Upload Resource{% endblock %}
{% block content %}
<section class="pc-page-header"><div class="container"><h1><i class="fas fa-upload me-2"></i>Upload Knowledge Resource</h1></div></section>
<section class="section-padding bg-light-grey"><div class="container" style="max-width:760px">
  <div class="pc-card p-4">
    {% if messages %}{% for msg in messages %}<div class="alert-polar-error mb-3"><i class="fas fa-exclamation-circle"></i> {{ msg }}</div>{% endfor %}{% endif %}
    <form method="post" enctype="multipart/form-data">{% csrf_token %}
      <div class="row g-3">
        <div class="col-12"><label class="pc-form-label">Title *</label><input type="text" name="title" class="pc-form-control" required></div>
        <div class="col-md-6"><label class="pc-form-label">Author *</label><input type="text" name="author" class="pc-form-control" required></div>
        <div class="col-md-6"><label class="pc-form-label">Institution</label><input type="text" name="institution" class="pc-form-control"></div>
        <div class="col-md-6">
          <label class="pc-form-label">Category</label>
          <select name="category" class="pc-form-control">{% for val, label in categories %}<option value="{{ val }}">{{ label }}</option>{% endfor %}</select>
        </div>
        <div class="col-md-6">
          <label class="pc-form-label">Resource Type</label>
          <select name="resource_type" class="pc-form-control">{% for val, label in types %}<option value="{{ val }}">{{ label }}</option>{% endfor %}</select>
        </div>
        <div class="col-md-6"><label class="pc-form-label">Publication Date</label><input type="date" name="publication_date" class="pc-form-control"></div>
        <div class="col-md-6"><label class="pc-form-label">Keywords (comma-separated)</label><input type="text" name="keywords" class="pc-form-control" placeholder="ice sheet, glaciology, climate"></div>
        <div class="col-12"><label class="pc-form-label">Abstract</label><textarea name="abstract" class="pc-form-control" rows="4" placeholder="Brief summary of the document…"></textarea></div>
        <div class="col-12"><label class="pc-form-label">Upload File (PDF/DOC)</label><input type="file" name="uploaded_file" class="pc-form-control" accept=".pdf,.doc,.docx"></div>
        <div class="col-12"><label class="pc-form-label">Or External URL</label><input type="url" name="external_url" class="pc-form-control" placeholder="https://…"></div>
        <div class="col-12 d-flex gap-2 mt-2">
          <button type="submit" class="btn-polar-primary"><i class="fas fa-upload me-1"></i>Upload Resource</button>
          <a href="{% url 'repository:list' %}" class="btn-polar-outline">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div></section>
{% endblock %}
