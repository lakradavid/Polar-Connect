{% extends 'base.html' %}
{% block title %}Upload Media{% endblock %}
{% block content %}
<section class="pc-page-header"><div class="container"><h1><i class="fas fa-upload me-2"></i>Upload Media</h1></div></section>
<section class="section-padding bg-light-grey"><div class="container" style="max-width:640px">
<div class="pc-card p-4">
  {% if messages %}{% for msg in messages %}<div class="alert-polar-error mb-3"><i class="fas fa-exclamation-circle"></i> {{ msg }}</div>{% endfor %}{% endif %}
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    <div class="row g-3">
      <div class="col-12"><label class="pc-form-label">Title *</label><input type="text" name="title" class="pc-form-control" required></div>
      <div class="col-md-6">
        <label class="pc-form-label">Media Type</label>
        <select name="media_type" class="pc-form-control">{% for val, label in media_types %}<option value="{{ val }}">{{ label }}</option>{% endfor %}</select>
      </div>
      <div class="col-md-6">
        <label class="pc-form-label">Category</label>
        <select name="category" class="pc-form-control"><option value="">None</option>{% for cat in categories %}<option value="{{ cat.pk }}">{{ cat.name }}</option>{% endfor %}</select>
      </div>
      <div class="col-12"><label class="pc-form-label">Description</label><textarea name="description" class="pc-form-control" rows="3"></textarea></div>
      <div class="col-md-6"><label class="pc-form-label">Image File</label><input type="file" name="image" class="pc-form-control" accept="image/*" data-preview="imgPreview"></div>
      <div class="col-md-6"><label class="pc-form-label">Embed URL (YouTube/Vimeo)</label><input type="url" name="embed_url" class="pc-form-control" placeholder="https://www.youtube.com/embed/…"></div>
      <div class="col-md-6"><label class="pc-form-label">Photographer</label><input type="text" name="photographer" class="pc-form-control"></div>
      <div class="col-md-6"><label class="pc-form-label">Location</label><input type="text" name="location" class="pc-form-control"></div>
      <div class="col-12"><label class="pc-form-label">Tags (comma-separated)</label><input type="text" name="tags" class="pc-form-control" placeholder="antarctic, ice, wildlife"></div>
      <img id="imgPreview" src="" style="display:none;max-height:160px;border-radius:8px;margin-top:0.5rem">
      <div class="col-12 d-flex gap-2 mt-2">
        <button type="submit" class="btn-polar-primary"><i class="fas fa-upload me-1"></i>Upload</button>
        <a href="{% url 'media_gallery:gallery' %}" class="btn-polar-outline">Cancel</a>
      </div>
    </div>
  </form>
</div>
</div></section>
{% endblock %}
